<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% block meta %}{% endblock %}
    <title>
      {% block title %}Decor By Pearls – Weddings With Elegance{% endblock %}
    </title>
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#1e1610" />
    <link rel="canonical" href="{{ request.base_url }}" />
    <meta property="og:site_name" content="Decor By Pearls" />
    <meta property="og:url" content="{{ request.base_url }}" />
    <meta property="og:image" content="{{ url_for('static', filename='images/gallery/slider/slider_01.webp', _external=True) }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{ url_for('static', filename='images/gallery/slider/slider_01.webp', _external=True) }}" />
    <!-- LocalBusiness Schema – renders on every page -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://www.decorbypearls.com/#localbusiness",
      "name": "Decor By Pearls",
      "image": "https://www.decorbypearls.com/static/images/logo_decorbypearls.png?v=1540000000",
      "url": "https://www.decorbypearls.com/",
      "telephone": "+91-7355051840",
      "priceRange": "$$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "4th Floor, Plot No. C-210 B, Fateh Tower, Industrial Area, Phase 8B, Sector 74",
        "addressLocality": "Sahibzada Ajit Singh Nagar",
        "addressRegion": "Punjab",
        "postalCode": "160071",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 30.713329,
        "longitude": 76.695566
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "09:00",
        "closes": "18:30"
      },
      "sameAs": [
        "https://www.facebook.com/people/Decor-By-Pearls/61578885675391/",
        "https://www.instagram.com/decor_bypearls"
      ]
    }
    </script>

    <!-- Organization + Person Schema – renders on every page -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.decorbypearls.com/#organization",
          "name": "Decor By Pearls",
          "url": "https://www.decorbypearls.com/",
          "logo": "https://www.decorbypearls.com/static/images/logo_decorbypearls.png?v=1540000000",
          "founder": {
            "@id": "https://www.decorbypearls.com/about/#mohit-kumar"
          },
          "employee": [
            {
              "@id": "https://www.decorbypearls.com/about/#sachin-mishra"
            },
            {
              "@id": "https://www.decorbypearls.com/about/#jasneet-kaur"
            }
          ],
          "sameAs": [
            "https://www.facebook.com/people/Decor-By-Pearls/61578885675391/",
            "https://www.instagram.com/decor_bypearls"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-7355051840",
            "contactType": "customer service",
            "areaServed": "IN",
            "availableLanguage": ["en", "hi"]
          }
        },
        {
          "@type": "Person",
          "@id": "https://www.decorbypearls.com/about/#mohit-kumar",
          "name": "Mohit Kumar",
          "jobTitle": "Founder",
          "worksFor": {
            "@id": "https://www.decorbypearls.com/#organization"
          },
          "url": "https://www.decorbypearls.com/about/"
        },
        {
          "@type": "Person",
          "@id": "https://www.decorbypearls.com/about/#sachin-mishra",
          "name": "Sachin Mishra",
          "jobTitle": "Co-Founder",
          "worksFor": {
            "@id": "https://www.decorbypearls.com/#organization"
          },
          "url": "https://www.decorbypearls.com/about/"
        },
        {
          "@type": "Person",
          "@id": "https://www.decorbypearls.com/about/#jasneet-kaur",
          "name": "Jasneet Kaur",
          "jobTitle": "Co-Founder",
          "worksFor": {
            "@id": "https://www.decorbypearls.com/#organization"
          },
          "url": "https://www.decorbypearls.com/about/"
        },
        {
          "@type": "WebSite",
          "name": "Decor By Pearls",
          "url": "{{ url_for('home', _external=True) }}",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ url_for('blog', _external=True) }}?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/favicons/apple-touch-icon.png') }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicons/favicon-32x32.png') }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicons/favicon-16x16.png') }}" />
    <link rel="manifest" href="{{ url_for('static', filename='images/favicons/site.webmanifest') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicons/favicon.ico') }}" />
    <!-- Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    {% block extra_css %}{% endblock %}

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FK449WTQT1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FK449WTQT1');
    </script>
  </head>

  <body>
    <!-- LOADER -->
    <div id="loader">
      <div class="loader-circle"></div>
      <div class="loader-logo-wrapper">
        <img
          src="{{ url_for('static', filename='images/logo_decorbypearls.png') }}"
          alt="Decor By Pearls"
          class="loader-logo-img"
        />
      </div>
      <div class="loader-line"></div>
    </div>
    {% include 'partials/navbar.html' %}

    <main>{% block content %}{% endblock %}</main>

    {% include 'partials/footer.html' %}

    <!-- LIGHTBOX -->
    <div class="lightbox-overlay" id="lightboxOverlay">
      <button class="lightbox-close" id="lightboxClose">✕</button>
      <div class="lightbox-wrapper">
        <button class="lightbox-arrow lightbox-arrow-prev" id="lightboxPrev">
          ←
        </button>
        <div class="lightbox-image-container">
          <img src="" alt="" id="lightboxImage" />
        </div>
        <button class="lightbox-arrow lightbox-arrow-next" id="lightboxNext">
          →
        </button>
      </div>
      <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
    </div>

    <!-- SCROLL TOP -->
    <button id="scroll-top" class="scroll-top-btn">
      <i class="ri-arrow-up-line"></i>
    </button>

    <div class="float-buttons">
      <a href="tel:+917355051840" class="call-float" title="Call Us">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
      </a>
      <a
        href="https://wa.me/917355051840"
        class="whatsapp-float"
        title="Chat on WhatsApp"
        target="_blank"
        rel="noopener"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
          />

      </a>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
